<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WETRO</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#0b0f17; overflow:hidden; font-family:system-ui,-apple-system,sans-serif; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0b0f17; z-index:10; gap:20px; }
  .logo { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#8b5cf6); display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:900; color:#fff; animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
  .status { color:#94a3b8; font-size:14px; text-align:center; padding:0 30px; line-height:1.5; }
  .spinner { width:40px; height:40px; border:3px solid #2a3446; border-top-color:#3b82f6; border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  iframe { width:100%; height:100%; border:0; display:block; background:#0b0f17; }
  .error-box { background:#7f1d1d; color:#fecaca; padding:16px 20px; border-radius:12px; font-size:13px; max-width:340px; text-align:center; line-height:1.5; }
  .retry-btn { background:#3b82f6; color:#fff; border:none; border-radius:12px; padding:12px 30px; font-size:15px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

<div id="splash">
  <div class="logo">W</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Загрузка...</div>
</div>

<iframe id="appFrame" style="display:none;"></iframe>

<script>
// ====== НАСТРОЙКИ ======
const DB_URL = 'https://wetro-messanger-default-rtdb.europe-west1.firebasedatabase.app';
const CODE_KEY = 'user'; // для юзер-версии. Для админки поменяй на 'admin'
// ======================

const statusEl = document.getElementById('status');
const spinner = document.getElementById('spinner');
const splash = document.getElementById('splash');
const frame = document.getElementById('appFrame');

async function loadCode() {
  try {
    statusEl.textContent = 'Проверка обновлений...';
    const url = DB_URL + '/code/' + CODE_KEY + '.json?t=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.json();
    if (!html || typeof html !== 'string' || html.length < 50) {
      throw new Error('Код на сервере пустой');
    }

    try { localStorage.setItem('wetro_cache_' + CODE_KEY, html); } catch(e) {}

    statusEl.textContent = 'Запуск...';

    // Загружаем через srcdoc (работает со скриптами)
    frame.srcdoc = html;
    frame.onload = () => {
      setTimeout(() => {
        splash.style.display = 'none';
        frame.style.display = 'block';
      }, 300);
    };

  } catch (err) {
    console.error('Load error:', err);

    // Пробуем кэш
    const cached = localStorage.getItem('wetro_cache_' + CODE_KEY);
    if (cached) {
      statusEl.textContent = 'Интернет недоступен, работаем из кэша...';
      frame.srcdoc = cached;
      frame.onload = () => {
        setTimeout(() => {
          splash.style.display = 'none';
          frame.style.display = 'block';
        }, 300);
      };
      return;
    }

    // Совсем никак
    spinner.style.display = 'none';
    splash.innerHTML = `
      <div class="error-box">
        <b>Ошибка загрузки</b><br><br>
        ${err.message}<br><br>
        Проверь интернет и попробуй снова.
      </div>
      <button class="retry-btn" onclick="location.reload()">Повторить</button>
    `;
  }
}

loadCode();
</script>
</body>
</html>
